<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI XMP Tagger Social Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #17202a;
        background: #f3f1ec;
        font-family:
          "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-columns: 500px 1fr;
        gap: 56px;
        width: 100%;
        height: 100%;
        padding: 72px 0 64px 72px;
        isolation: isolate;
      }

      .card::before {
        position: absolute;
        z-index: -1;
        top: -240px;
        right: -176px;
        width: 690px;
        height: 690px;
        border: 1px solid rgba(37, 99, 235, 0.16);
        border-radius: 50%;
        content: "";
      }

      .identity {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        flex: 0 0 auto;
        color: #fffefa;
        background: #17202a;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }

      .name {
        margin: 0;
        font-size: 40px;
        font-weight: 760;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .blue-rule {
        width: 48px;
        height: 5px;
        margin: 80px 0 26px;
        background: #2563eb;
      }

      h1 {
        max-width: 470px;
        margin: 0;
        font-size: 43px;
        font-weight: 740;
        letter-spacing: -0.035em;
        line-height: 1.22;
      }

      .platforms {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: auto 0 2px;
        color: rgba(23, 32, 42, 0.72);
        font-size: 20px;
        font-weight: 570;
        letter-spacing: 0.01em;
      }

      .platforms::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2563eb;
        content: "";
      }

      .preview-wrap {
        position: relative;
        align-self: center;
        width: 640px;
        height: 444px;
        overflow: hidden;
        border: 1px solid rgba(23, 32, 42, 0.14);
        border-radius: 18px 0 0 18px;
        background: #fffefa;
        box-shadow:
          0 30px 70px rgba(23, 32, 42, 0.14),
          0 3px 10px rgba(23, 32, 42, 0.08);
      }

      .window-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 17px;
        border-bottom: 1px solid rgba(23, 32, 42, 0.1);
        background: #fffefa;
      }

      .window-bar span {
        width: 8px;
        height: 8px;
        border: 1px solid rgba(23, 32, 42, 0.24);
        border-radius: 50%;
      }

      .window-bar span:first-child {
        border-color: #2563eb;
        background: #2563eb;
      }

      .preview {
        display: block;
        width: 640px;
        height: 400px;
        object-fit: cover;
        object-position: top left;
      }

      .preview-accent {
        position: absolute;
        z-index: -1;
        right: 42px;
        bottom: 38px;
        width: 112px;
        height: 112px;
        border-radius: 18px;
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="AI XMP Tagger 分享卡片">
      <section class="identity">
        <div class="brand">
          <div class="mark" aria-hidden="true">XMP</div>
          <p class="name">AI XMP Tagger</p>
        </div>
        <div class="blue-rule" aria-hidden="true"></div>
        <h1>浏览器直接批量写入与检查 XMP</h1>
        <p class="platforms">Mac / Windows · 图片不上传</p>
      </section>

      <section class="preview-wrap" aria-label="真实应用首页预览">
        <div class="window-bar" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <img
          class="preview"
          src="./public/images/browser-workbench.png"
          width="1440"
          height="1560"
          alt="AI XMP Tagger 真实应用首页"
        >
      </section>
      <div class="preview-accent" aria-hidden="true"></div>
    </main>
  </body>
</html>
